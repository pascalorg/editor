services:
  # Local Postgres for development. Production runs its own managed instance
  # behind PgBouncer — see `packages/db/README.md`.
  #
  # Port 5433 on the host on purpose: 5432 is usually already taken by a
  # system Postgres, and the failure that causes ("password authentication
  # failed") points at credentials rather than at the wrong server.
  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: pascal
      POSTGRES_PASSWORD: pascal
      POSTGRES_DB: pascal
    volumes:
      - pascal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pascal -d pascal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  editor:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Scene database location. Without the volume below, every saved project is
      # discarded when the container is recreated.
      PASCAL_DATA_DIR: /data
    volumes:
      - pascal-data:/data
    restart: unless-stopped

volumes:
  pascal-data:
  pascal-postgres:
