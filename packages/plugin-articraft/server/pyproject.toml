[project]
name = "pascal-articraft-worker"
version = "0.1.0"
description = "Reference mini-articraft generation worker for the Pascal Articraft plugin"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mini-articraft @ git+https://github.com/articraftresearch/Articraft.git@82ce38a640b58ef88f6c8b8c922518b40c66b6db",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
