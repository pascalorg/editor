<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Procedural trees — standalone study</title>
  <link rel="icon" href="data:,">
  <style>
    html,body { margin:0; overflow:hidden; font:500 16px/1.4 system-ui,sans-serif; background:#dce5e8 }
    canvas { display:block }
    #label { position:fixed; top:16px; left:18px; background:#ffffffdf; padding:10px 15px; border-radius:8px; pointer-events:none }
    small { display:block; font-size:13px }
  </style>
  <script type="importmap">{"imports":{"three":"/three/build/three.webgpu.js","three/webgpu":"/three/build/three.webgpu.js","three/tsl":"/three/build/three.tsl.js"}}</script>
</head>
<body>
<div id="label"></div>
<script type="module">
import * as THREE from 'three/webgpu'
import {
  TREE_FORMS, defaultTreeSpread, buildPlanting, PlantingNode, buildHedge, HedgeNode, FLAT_GROUND,
  addTree, SiteNode, TreeNode, resolveTreeParameters, createTerrainField, encodeTerrainField,
  buildTreeFloorplan, buildTreeGeometry, buildTreeFarGeometry, estimateTree, disposeTreeResources,
} from './tree-bundle.js'

import { loadReference, referenceTree, measureTree } from './comparison.js'

const query = new URLSearchParams(location.search)
if (query.has('embedded')) document.getElementById('label').hidden = true
const mode = query.get('scene') ?? 'single'
const form = query.get('form') ?? 'round'
const heightM = Number(query.get('height') ?? 8)
const seed = Number(query.get('seed') ?? 19)
const library = query.get('library') ?? 'pascal'
if (library === 'ez') await loadReference()
const scene = new THREE.Scene()
const studio = ['forms', 'trio', 'sheet', 'levels', 'winter', 'single'].includes(mode)
scene.background = new THREE.Color(studio ? '#e6e8df' : '#dce5e8')
if (mode === 'garden' || mode === 'alley') scene.fog = new THREE.Fog('#dce5e8', 48, 150)
const renderer = new THREE.WebGPURenderer({ antialias:true, forceWebGL:query.get('gl') === '1' })
renderer.setPixelRatio(1)
renderer.setSize(innerWidth, innerHeight)
renderer.toneMapping = THREE.NeutralToneMapping
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFShadowMap
await renderer.init()
document.body.appendChild(renderer.domElement)
scene.add(new THREE.HemisphereLight('#e4f1ff','#606d45',2.4))
const sun = new THREE.DirectionalLight('#fff0da',3.2)
sun.position.set(-18,30,18)
sun.castShadow = true
sun.shadow.mapSize.set(2048,2048)
Object.assign(sun.shadow.camera,{left:-35,right:35,top:35,bottom:-35,near:0.5,far:100})
sun.shadow.bias = -0.0003
sun.shadow.normalBias = 0.04
scene.add(sun)
const material = new THREE.MeshStandardNodeMaterial({vertexColors:true,roughness:0.9,side:THREE.DoubleSide})
const metrics = []
let operationResult
const benchmark = query.get('bench') === '1'
// Hold one unrelated tree so repeated cold geometry builds share a warm atlas.
const sentinel = benchmark && library === 'pascal'
  ? buildTreeGeometry(TreeNode.parse({ seed: -2147483648, heightM: 2 }))
  : null

function timedBuild(build, release) {
  const times = []
  const runs = benchmark ? 8 : 1
  for (let i = 0; i < runs; i++) {
    const start = performance.now()
    const value = build()
    const elapsed = performance.now() - start
    if (i > 0 || runs === 1) times.push(elapsed)
    if (i === runs - 1) {
      const sorted = [...times].sort((a, b) => a - b)
      return { value, buildMs: sorted[Math.floor(sorted.length / 2)], buildSamplesMs: times }
    }
    release(value)
  }
}

function meshOf(attributes, position = [0,0,0]) {
  const geometry = new THREE.BufferGeometry()
  for (const key of ['position','normal','color'])
    geometry.setAttribute(key,new THREE.BufferAttribute(attributes[key],3))
  geometry.setIndex(new THREE.BufferAttribute(attributes.index,1))
  const mesh = new THREE.Mesh(geometry,material)
  mesh.position.set(...position)
  mesh.castShadow = true
  mesh.receiveShadow = true
  scene.add(mesh)
  return mesh
}

function treeAt(form, heightM, seed, at, extra = {}) {
  const input = {
    form, heightM, spreadM: defaultTreeSpread(form, heightM), seed,
    foliage: '#609343', density: 0.85, gen: 1, ...extra,
  }
  if (library === 'ez') {
    const { value, buildMs, buildSamplesMs } = timedBuild(
      () => referenceTree(form, heightM, mode === 'garden' ? seed : undefined),
      ({ tree }) => tree.traverse(mesh => {
        if (mesh.isMesh) {
          mesh.geometry.dispose()
          mesh.material.dispose()
        }
      }),
    )
    const { tree, preset, referenceSeed } = value
    tree.position.x = at[0]
    tree.position.y += at[1]
    tree.position.z = at[2]
    scene.add(tree)
    metrics.push({ input, at, preset, referenceSeed, buildMs, buildSamplesMs, ...measureTree(tree) })
  } else {
    const node = TreeNode.parse({ ...input, position: at })
    sceneTreeAt(node, {}, extra.level ?? 'near')
  }
}

function sceneTreeAt(node, nodes, level = 'near') {
  const input = resolveTreeParameters(node)
  const context = { sceneNodes: nodes, parent: nodes[node.parentId], resolve: id => nodes[id] }
  const build = level === 'far' ? buildTreeFarGeometry : buildTreeGeometry
  const { value: group, buildMs, buildSamplesMs } = timedBuild(() => build(node, context), disposeTreeResources)
  group.position.set(node.position[0], 0, node.position[2])
  scene.add(group)
  metrics.push({
    input, at: node.position, level, buildMs, buildSamplesMs,
    ...estimateTree(input), ...measureTree(group),
  })
}

function treePlan(node, nodes) {
  const symbol = buildTreeFloorplan(node,{sceneNodes:nodes,resolve:id=>nodes[id]})
  const element = part => {
    const item = document.createElementNS('http://www.w3.org/2000/svg',part.kind === 'group' ? 'g' : part.kind)
    for (const [key,value] of Object.entries(part)) {
      if (key === 'children') for (const child of value) item.appendChild(element(child))
      else if (key !== 'kind' && key !== 'metadata')
        item.setAttribute(key.replace(/[A-Z]/g,letter=>`-${letter.toLowerCase()}`),String(value))
    }
    return item
  }
  return element(symbol)
}

function box(size, at, color) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size),new THREE.MeshStandardNodeMaterial({color,roughness:1}))
  mesh.position.set(...at)
  mesh.castShadow = true
  mesh.receiveShadow = true
  scene.add(mesh)
  return mesh
}

function ground(width = 100, slope = 0) {
  const geometry = new THREE.PlaneGeometry(width,width).rotateX(-Math.PI/2)
  const position = geometry.getAttribute('position')
  for (let index=0;index<position.count;index++) position.setY(index,position.getX(index)*slope)
  geometry.computeVertexNormals()
  const surface = studio ? new THREE.ShadowMaterial({color:'#4e574c',opacity:0.20}) : new THREE.MeshStandardNodeMaterial({color:'#86976b',roughness:1})
  const lawn = new THREE.Mesh(geometry,surface)
  lawn.receiveShadow = true
  scene.add(lawn)
}

function labelAt(text, at) {
  const canvas = document.createElement('canvas')
  canvas.width = 512; canvas.height = 64
  const context = canvas.getContext('2d')
  context.fillStyle = '#f5f4ed'; context.fillRect(0,0,512,64)
  context.fillStyle = '#273329'; context.font = '500 30px system-ui'; context.textAlign = 'center'
  context.fillText(text,256,44)
  const map = new THREE.CanvasTexture(canvas)
  const sprite = new THREE.Sprite(new THREE.SpriteNodeMaterial({map,depthTest:false}))
  sprite.position.set(...at); sprite.scale.set(8,1,1)
  scene.add(sprite)
}

let cameraPosition = [13,8,18], target = [0,4,0], fov = 38
ground(440,mode === 'slope' ? 0.12 : 0)
if (mode === 'forms') {
  const positions=[-22.5,-13.5,-4.5,4.5,13.5,22.5]
  TREE_FORMS.forEach((form,i)=>treeAt(form,8,19,[positions[i],0,0]))
  // A 1.8 m standing figure on the same ground plane as the trunks.
  const cloth=new THREE.MeshStandardMaterial({color:'#54616a',roughness:1})
  const part=(geometry,x,y,z,material=cloth)=>{
    const mesh=new THREE.Mesh(geometry,material)
    mesh.position.set(x,y,z);mesh.castShadow=true;scene.add(mesh)
  }
  const fx=-27.2
  for(const d of [-0.1,0.1]) part(new THREE.CapsuleGeometry(0.082,0.69,4,8),fx+d,0.435,0)
  part(new THREE.CapsuleGeometry(0.19,0.37,4,8),fx,1.13,0)
  for(const side of [-1,1]) part(new THREE.CapsuleGeometry(0.064,0.47,4,8),fx+side*0.218,1.10,0)
  part(new THREE.SphereGeometry(0.137,12,8),fx,1.663,0,new THREE.MeshStandardMaterial({color:'#a58a72'}))
  cameraPosition = [-1,12,80]; target = [-1,4.0,0]; fov = 25
} else if (mode === 'trio') {
  const spread = defaultTreeSpread(form,heightM)
  for(let variant=0;variant<3;variant++)
    treeAt(form,heightM,[19,41,83][variant],[(variant-1)*spread*1.35,0,0])
  // Identical pixels per metre at each height. Wider panels accommodate larger crowns.
  cameraPosition = [0,15,80]
  target = [0,7.55,0]
} else if (mode === 'sheet') {
  for (let column=0;column<3;column++) {
    const height = [4,8,14][column]
    for (let variant=0;variant<3;variant++)
      treeAt(form,height,[19,41,83][variant],[(column-1)*23+(variant-1)*7,0,0])
    labelAt(`${height} m · seeds 19 / 41 / 83`,[(column-1)*23,0.1,4])
  }
  cameraPosition = [25,15,62]; target = [0,5,0]; fov = 47
} else if (mode === 'garden') {
  box([11,4.2,7],[0,2.1,-5],'#e5dfd2')
  box([0.95,2.5,0.05],[0,1.25,-1.46],'#645242')
  for (const x of [-3.3,3.3]) box([2.2,1.6,0.07],[x,2.3,-1.44],'#7d999e')
  box([2,0.03,18],[0,0.01,5],'#c7bfa6')
  for (const x of [-4.6,4.6]) {
    const bed = PlantingNode.parse({outline:[[x-2.5,0.6],[x+2.5,0.6],[x+2.5,2.8],[x-2.5,2.8]],seed:19})
    for (const mesh of buildPlanting(bed,FLAT_GROUND).meshes) meshOf(mesh)
  }
  const hedge = HedgeNode.parse({path:[[-13,-10],[-13,11]],clip:0.3,gen:2,height:1.25,width:0.8,seed:21})
  for (const mesh of buildHedge(hedge,FLAT_GROUND).meshes) meshOf(mesh)
  for (const [form,height,seed,x,z] of [
    ['round',8,19,-11.5,-0.75],['multistem',4,41,-2.8,8.6],['spreading',7,17,-11,9.8],
    ['conifer',12,24,-3.1,-12.8],['upright',9,59,-8.8,-11.6],['weeping',8.5,83,10.8,6.3],['spreading',6,52,14.5,-9.6],
  ]) treeAt(form,height,seed,[x,0,z])
  cameraPosition = [14,12,36]; target = [0,3.7,2]; fov = 43
} else if (mode === 'levels') {
  treeAt(form,heightM,seed,[-5,0,0])
  treeAt(form,heightM,seed,[5,0,0],{level:'far'})
  labelAt('Near',[-5,0.3,4]); labelAt('Far · no runtime switch',[5,0.3,4])
  cameraPosition = [0,7,34]; target = [0,4,0]
} else if (mode === 'winter') {
  treeAt(form,heightM,seed,[-5,0,0],{density:0})
  treeAt(form,heightM,seed,[5,0,0],{foliage:'#c17c28'})
  cameraPosition = [14,9,25]; target = [0,3.5,0]
} else if (mode === 'alley') {
  const site = SiteNode.parse({polygon:{type:'polygon',points:[[-20,-20],[20,-20],[20,40],[-20,40]]}})
  const nodes = {[site.id]:site}
  const trees = [-1,1].flatMap(side=>Array.from({length:4},(_,index)=>({at:[side*4,index*8]})))
  const outcome = addTree(nodes,{heightM:8,seed:19,trees},{activeLevelId:null})
  operationResult = outcome.result
  for (const {node} of outcome.changes.create) sceneTreeAt(node,nodes)
  box([3,0.02,40],[0,0.01,12],'#c6bea7')
  cameraPosition = [1,3,-12]; target = [0,4,15]; fov = 57
} else if (mode === 'slope') {
  const field = createTerrainField({origin:[-16,-16],spacing:1,cols:33,rows:33})
  for(let row=0;row<33;row++)
    for(let column=0;column<33;column++) field.heights[row*33+column]=(column-16)*12
  const site = SiteNode.parse({terrain:encodeTerrainField(field)})
  const node = TreeNode.parse({parentId:site.id,position:[4,0,0],heightM,form,seed})
  sceneTreeAt(node,{[site.id]:site})
  cameraPosition = [9,2.4,12]; target = [4,3.8,0]; fov = 48
} else if (mode === 'plan') {
  const site = SiteNode.parse({})
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg')
  svg.setAttribute('viewBox','-16 -10 32 20')
  Object.assign(svg.style,{position:'fixed',inset:0,width:'100%',height:'100%',background:'#f7f5ee'})
  for (const [index,form] of ['round','upright','weeping'].entries()) {
    const node = TreeNode.parse({parentId:site.id,position:[(index-1)*9,0,0],form,heightM:8,seed:19})
    svg.appendChild(treePlan(node,{[site.id]:site}))
    const input = resolveTreeParameters(node)
    metrics.push({input,at:node.position,buildMs:0,...estimateTree(input)})
  }
  document.body.appendChild(svg)
  document.getElementById('label').style.zIndex = 1
} else {
  treeAt(form,heightM,seed,[0,0,0])
  if(mode === 'close') { cameraPosition = [1.45,1.7,1.20]; target = [-0.3,6.0,0.2]; fov = 68 }
}
if(sentinel) disposeTreeResources(sentinel)
const aspect=innerWidth/innerHeight
const halfWidth = mode === 'forms' ? 29 : mode === 'trio' ? 8.2 * aspect : null
const camera = halfWidth === null
  ? new THREE.PerspectiveCamera(fov, aspect, 0.1, 250)
  : new THREE.OrthographicCamera(-halfWidth, halfWidth, halfWidth/aspect, -halfWidth/aspect, 0.1, 250)
camera.position.set(...cameraPosition); camera.lookAt(...target)
for(let frame=0;frame<2;frame++){renderer.render(scene,camera);await new Promise(requestAnimationFrame)}
const backend = renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL2'
document.getElementById('label').innerHTML = `${library==='ez' ? 'ez-tree 1.1.0' : 'Pascal'} · ${mode === 'sheet' || mode === 'trio' ? `${form} · ${heightM} m · seeds 19 / 41 / 83` : mode}<small>${metrics.length} trees · ${metrics.reduce((sum,item)=>sum+item.triangles,0).toLocaleString('en-US')} triangles · ${backend}</small>`
window.__stats = {
  mode, form, library, metrics, operationResult, backend,
  camera: {
    position: cameraPosition, target, aspect, projection: camera.type,
    ...(camera.isOrthographicCamera
      ? { left: camera.left, right: camera.right, top: camera.top, bottom: camera.bottom }
      : { fov }),
  },
  trianglesDrawn: renderer.info.render.triangles,
}
window.__done = true

</script>
</body>
</html>
