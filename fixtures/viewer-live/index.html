    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Pascal live viewer fixture</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { font-family: system-ui, sans-serif; }
      [data-enter-walkthrough] { position: fixed; top: 12px; right: 12px; z-index: 50; }
      [data-walkthrough-hud] { position: fixed; inset: 0; pointer-events: none; }
      [data-walkthrough-crosshair] { position: absolute; top: 50%; left: 50%; }
      [data-walkthrough-crosshair] > div { width: 6px; height: 6px; border-radius: 50%; background: white; }
      output { position: fixed; top: 12px; left: 12px; }
    </style>
  </head>
