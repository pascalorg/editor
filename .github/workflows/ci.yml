name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run check

      - name: Type check
        run: bun run check-types

      # Only the library packages — the Next app build needs runtime env vars
      # and emits no `dist/` for the parity check below.
      - name: Build packages
        run: bunx turbo run build --filter='./packages/*'

      # Guards against a `dist/` that the app would bundle but no source in
      # the repo produces — see tooling/check-dist-parity.mjs.
      - name: dist/src parity
        run: bun run check-dist
