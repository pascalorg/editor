name: Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing editor release version (without the package prefix)"
        required: true
        type: string
      publish:
        description: "Publish to GHCR (otherwise build only)"
        default: false
        type: boolean

concurrency:
  group: docker-publication
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || [[ ${#VERSION} -gt 128 ]]; then
            echo 'Expected an editor release version suitable for a Docker tag.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/@pascal-app/editor@${{ inputs.version }}
          persist-credentials: false

      - name: Verify release version
        env:
          VERSION: ${{ inputs.version }}
        run: jq -e --arg version "$VERSION" '.version == $version' packages/editor/package.json

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: ghcr.io/${{ github.repository }}:${{ inputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
