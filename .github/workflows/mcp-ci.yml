name: mcp-ci

on:
  push:
    branches: [main]
    paths:
      - 'packages/mcp/**'
      - 'packages/core/**'
      - 'apps/editor/app/api/scenes/**'
      - 'apps/editor/lib/scene-*'
      - 'apps/editor/package.json'
      - 'bun.lock'
      - '.github/workflows/mcp-ci.yml'
  pull_request:
    paths:
      - 'packages/mcp/**'
      - 'packages/core/**'
      - 'apps/editor/app/api/scenes/**'
      - 'apps/editor/lib/scene-*'
      - 'apps/editor/package.json'
      - 'bun.lock'
      - '.github/workflows/mcp-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      # plugin-warehouse is a private repository, so the runner needs a key to
      # clone it. bun shells out to `git clone` for a git+ssh dependency, which
      # is why this is an ssh key rather than a token: bun has no documented way
      # to authenticate the api.github.com tarball a `github:` spec would use.
      - name: Authorize the private plugin repository
        env:
          PLUGIN_SSH_KEY: ${{ secrets.PLUGIN_SSH_KEY }}
        run: |
          if [ -z "$PLUGIN_SSH_KEY" ]; then
            echo "PLUGIN_SSH_KEY is not set — the private plugin will fail to resolve."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$PLUGIN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build core
        run: bun run --cwd packages/core build

      - name: Build mcp
        run: bun run --cwd packages/mcp build

      - name: Test mcp
        run: bun test --cwd packages/mcp

      - name: Test editor scene API
        run: bun test apps/editor/lib/scene-store-server.test.ts apps/editor/lib/scene-api-security.test.ts

      - name: Biome check
        run: bunx biome check packages/mcp apps/editor/lib/scene-store-server.ts apps/editor/lib/scene-api-security.ts apps/editor/app/api/scenes
