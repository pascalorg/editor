name: mcp-ci

on:
  push:
    branches: [main]
    paths:
      - 'packages/mcp/**'
      - 'packages/core/**'
      - 'apps/editor/app/api/scenes/**'
      - 'apps/editor/lib/scene-*'
      - 'apps/editor/package.json'
      - 'bun.lock'
      - '.github/workflows/mcp-ci.yml'
  pull_request:
    paths:
      - 'packages/mcp/**'
      - 'packages/core/**'
      - 'apps/editor/app/api/scenes/**'
      - 'apps/editor/lib/scene-*'
      - 'apps/editor/package.json'
      - 'bun.lock'
      - '.github/workflows/mcp-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build core
        run: bun run --cwd packages/core build

      - name: Build mcp
        run: bun run --cwd packages/mcp build

      # The mcp and scene-API unit tests and the Biome check already run in
      # ci.yml's quality job; this lane only adds what that job cannot: the
      # published Node entrypoint of the built package.
      - name: Smoke-test the published Node entrypoint
        run: bun run --cwd packages/mcp smoke:node
